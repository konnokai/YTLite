name: Generate TrollFools/Cyan files

on:
  workflow_dispatch:
    inputs:
      create_cyan:
        description: "Generate .cyan file"
        type: boolean
        required: true
        default: true

      create_tf:
        description: "Generate .zip for TrollFools"
        type: boolean
        required: true
        default: true

      enable_youpip:
        description: "Integrate YouPiP"
        type: boolean
        required: true
        default: false

      enable_ytuhd:
        description: "Integrate YTUHD"
        type: boolean
        required: true
        default: false

      enable_yq:
        description: "Integrate YouQuality"
        type: boolean
        required: true
        default: false

      enable_ryd:
        description: "Integrate Return YouTube Dislikes"
        type: boolean
        required: true
        default: false

      enable_ytabc:
        description: "Integrate YTABConfig"
        type: boolean
        required: true
        default: false

      enable_demc:
        description: "Integrate DontEatMyContent"
        type: boolean
        required: true
        default: false

      tweak_version:
        description: "The version of the tweak to use. Enter the version manually from dayanch96/YTLite/releases or leave default (ignored when tweak_url is set)"
        default: "5.2.2"
        required: true
        type: string

      tweak_url:
        description: "Optional: direct URL to a prebuilt ytplus.deb (e.g. a patched build). When set, it is used instead of downloading tweak_version from the original repo. GitHub release assets in private repos need the REDIRECT_DEB_TOKEN (or TWEAK_DEB_TOKEN) secret"
        default: ""
        required: false
        type: string

      display_name:
        description: "App Name (Optional)"
        default: "YouTube"
        required: true
        type: string

      bundle_id:
        description: "BundleID (Optional)"
        default: "com.google.ios.youtube"
        required: true
        type: string

      redirect_deb_url:
        description: "URL of the YTL Domain Redirect deb to inject (optional; a direct .deb or a zip containing one)"
        default: ""
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tweaks:
    uses: ./.github/workflows/_build_tweaks.yml
    secrets: inherit
    with:
      enable_youpip: ${{ inputs.enable_youpip }}
      enable_ytuhd: ${{ inputs.enable_ytuhd }}
      enable_yq: ${{ inputs.enable_yq }}
      enable_ryd: ${{ inputs.enable_ryd }}
      enable_ytabc: ${{ inputs.enable_ytabc }}
      enable_demc: ${{ inputs.enable_demc }}
      tweak_version: ${{ inputs.tweak_version }}
      tweak_url: ${{ inputs.tweak_url }}

  package:
    name: Generate Cyan/TrollFools
    runs-on: macos-latest
    needs: build-tweaks
    permissions:
      contents: write

    steps:
      - name: Download built debs
        uses: actions/download-artifact@v8
        with:
          name: built-debs
          path: ${{ github.workspace }}

      - name: Download YTL Domain Redirect deb
        if: ${{ inputs.redirect_deb_url != '' }}
        env:
          REDIRECT_DEB_TOKEN: ${{ secrets.REDIRECT_DEB_TOKEN }}
          GH_TOKEN: ${{ secrets.REDIRECT_DEB_TOKEN || github.token }}
        run: |
          set -euo pipefail
          src="${{ inputs.redirect_deb_url }}"
          # 私有 repo 的 releases/download 直連 URL 帶 token 會 404，改成用 gh 抓；
          # 其他 URL（公開直連、API asset URL、已簽章 URL）走 curl。
          gh_repo=""
          gh_tag=""
          gh_asset=""
          if [[ "$src" =~ ^https://github\.com/([^/]+)/([^/]+)/releases/download/([^/]+)/([^/]+)$ ]]; then
            gh_repo="${BASH_REMATCH[1]}/${BASH_REMATCH[2]}"
            gh_tag="${BASH_REMATCH[3]}"
            gh_asset="${BASH_REMATCH[4]}"
          elif [[ "$src" =~ ^https://github\.com/([^/]+)/([^/]+)/releases/latest/download/([^/]+)$ ]]; then
            gh_repo="${BASH_REMATCH[1]}/${BASH_REMATCH[2]}"
            gh_asset="${BASH_REMATCH[3]}"
          fi
          if [ -n "$gh_repo" ]; then
            rm -rf /tmp/ytlredirect-dl
            mkdir -p /tmp/ytlredirect-dl
            if [ -n "$gh_tag" ]; then
              gh release download "$gh_tag" -R "$gh_repo" -p "$gh_asset" -D /tmp/ytlredirect-dl
            else
              gh release download -R "$gh_repo" -p "$gh_asset" -D /tmp/ytlredirect-dl
            fi
            src="/tmp/ytlredirect-dl/$gh_asset"
          else
            curl_args=(-fL --retry 3)
            if [ -n "${REDIRECT_DEB_TOKEN:-}" ]; then
              curl_args+=(-H "Authorization: Bearer $REDIRECT_DEB_TOKEN" -H "Accept: application/octet-stream")
            fi
            curl "${curl_args[@]}" "$src" -o /tmp/ytlredirect-download
            src="/tmp/ytlredirect-download"
          fi
          case "$(file --mime-type -b "$src")" in
            application/vnd.debian.binary-package|application/x-debian-package)
              mv "$src" ytlredirect.deb
              ;;
            application/zip)
              # zips contain the debs, e.g. under packages/ in an artifact zip
              rm -rf /tmp/ytlredirect-extract
              mkdir -p /tmp/ytlredirect-extract
              unzip -q "$src" -d /tmp/ytlredirect-extract
              deb=$(find /tmp/ytlredirect-extract -name '*_iphoneos-arm.deb' -print -quit)
              [ -n "$deb" ] || deb=$(find /tmp/ytlredirect-extract -name '*.deb' -print -quit)
              if [ -z "$deb" ]; then
                echo "::error::No .deb found inside the downloaded zip."
                exit 1
              fi
              cp "$deb" ytlredirect.deb
              ;;
            *)
              echo "::error::Downloaded file is neither a deb nor a zip."
              exit 1
              ;;
          esac
          file ytlredirect.deb

      - name: Check Inputs
        if: ${{ !inputs.create_cyan && !inputs.create_tf }}
        run: |
          echo "No output format selected."
          exit 0

      - name: Install Dependencies
        run: brew install dpkg

      - name: Install cyan
        if: ${{ github.event.inputs.create_cyan }}
        run: pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      - name: Generate .cyan file
        if: ${{ github.event.inputs.create_cyan }}
        run: |
          tweaks="ytplus.deb OpenYoutubeSafariExtension.appex"
          for f in *.deb; do
            [ -f "$f" ] && tweaks="$tweaks $f"
          done
          cgen -uwef $tweaks -n "${{ github.event.inputs.display_name }}" -b ${{ github.event.inputs.bundle_id }} -o cyan_YouTubePlus_${{ github.event.inputs.tweak_version }}.cyan

      - name: Generate .zip file for TrollFools
        if: ${{ github.event.inputs.create_tf }}
        run: |
          mkdir -p ytp_tf
          for f in *.deb; do
            if [ -f "$f" ]; then
              mkdir -p tmp_deb
              dpkg-deb -x "$f" tmp_deb
              find tmp_deb -type f -name "*.dylib" -exec cp -R {} ytp_tf/ \;
              find tmp_deb -type d -name "*.bundle" -exec cp -R {} ytp_tf/ \;
              rm -rf tmp_deb
            fi
          done
          cd ytp_tf
          zip -r "../TrollFools_YouTubePlus_${{ github.event.inputs.tweak_version }}.zip" .
          cd ..
          rm -rf ytp_tf

      - name: Set output file list
        id: filelist
        run: |
          files=""
          [ "${{ github.event.inputs.create_cyan }}" = "true" ] && files="${files}cyan_YouTubePlus_${{ github.event.inputs.tweak_version }}.cyan"$'\n'
          [ "${{ github.event.inputs.create_tf }}" = "true" ]   && files="${files}TrollFools_YouTubePlus_${{ github.event.inputs.tweak_version }}.zip"$'\n'
          echo -e "files<<EOF" >> $GITHUB_OUTPUT
          echo -e "$files" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ytp-${{ github.run_number }}
          name: YouTubePlus v${{ github.event.inputs.tweak_version }}_cyan_trollfools (${{ github.run_number }})
          files: ${{ steps.filelist.outputs.files }}
          draft: true

      - name: Output Release URL
        run: |
          echo "::notice::Release available at: https://github.com/${{ github.repository }}/releases"