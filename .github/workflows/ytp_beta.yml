name: '[BETA] Create YouTube Plus app'

on:
  workflow_dispatch:
    inputs:
      enable_youpip:
        description: "Integrate YouPiP"
        type: boolean
        required: true
        default: false

      enable_ytuhd:
        description: "Integrate YTUHD"
        type: boolean
        required: true
        default: false

      enable_yq:
        description: "Integrate YouQuality"
        type: boolean
        required: true
        default: false

      enable_ryd:
        description: "Integrate Return YouTube Dislikes"
        type: boolean
        required: true
        default: false

      enable_ytabc:
        description: "Integrate YTABConfig"
        type: boolean
        required: true
        default: false

      enable_demc:
        description: "Integrate DontEatMyContent"
        type: boolean
        required: true
        default: false

      enable_localization:
        description: "Update localization files from repo"
        type: boolean
        required: true
        default: false

      ipa_url:
        description: "URL to the decrypted IPA file"
        default: ""
        required: true
        type: string

      tweak_url:
        description: "URL to the YouTube Plus tweak file (a ytplus.deb, e.g. a patched build). GitHub release assets in private repos need the REDIRECT_DEB_TOKEN (or TWEAK_DEB_TOKEN) secret"
        default: ""
        required: true
        type: string

      redirect_deb_url:
        description: "URL of the YTL Domain Redirect deb to inject (optional; a direct .deb or a zip containing one)"
        default: ""
        required: false
        type: string

      display_name:
        description: "App Name (Optional)"
        default: "YouTube"
        required: true
        type: string

      bundle_id:
        description: "BundleID (Optional)"
        default: "com.google.ios.youtube"
        required: true
        type: string

      info_note:
        description: "TIP: Learn more about integrations in the README via the link below"
        default: "https://github.com/dayanch96/YTLite#tweak-integration-details"
        type: string
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tweaks:
    uses: ./.github/workflows/_build_tweaks.yml
    secrets: inherit
    with:
      enable_youpip: ${{ inputs.enable_youpip }}
      enable_ytuhd: ${{ inputs.enable_ytuhd }}
      enable_yq: ${{ inputs.enable_yq }}
      enable_ryd: ${{ inputs.enable_ryd }}
      enable_ytabc: ${{ inputs.enable_ytabc }}
      enable_demc: ${{ inputs.enable_demc }}
      enable_localization: ${{ inputs.enable_localization }}
      tweak_url: ${{ inputs.tweak_url }}

  package:
    name: Package IPA (Beta)
    runs-on: macos-latest
    needs: build-tweaks
    permissions:
      contents: write

    steps:
      - name: Download built debs
        uses: actions/download-artifact@v8
        with:
          name: built-debs
          path: ${{ github.workspace }}

      - name: Hide sensitive inputs
        uses: levibostian/action-hide-sensitive-inputs@v1
        with:
          exclude_inputs: bundle_id,display_name,enable_demc,enable_ryd,enable_ytabc,enable_youpip,enable_yq,enable_ytuhd,enable_localization,info_note

      - name: Download YTL Domain Redirect deb
        if: ${{ inputs.redirect_deb_url != '' }}
        env:
          REDIRECT_DEB_TOKEN: ${{ secrets.REDIRECT_DEB_TOKEN }}
          GH_TOKEN: ${{ secrets.REDIRECT_DEB_TOKEN || github.token }}
        run: |
          set -euo pipefail
          src="${{ inputs.redirect_deb_url }}"
          # 私有 repo 的 releases/download 直連 URL 帶 token 會 404，改成用 gh 抓；
          # 其他 URL（公開直連、API asset URL、已簽章 URL）走 curl。
          gh_repo=""
          gh_tag=""
          gh_asset=""
          if [[ "$src" =~ ^https://github\.com/([^/]+)/([^/]+)/releases/download/([^/]+)/([^/]+)$ ]]; then
            gh_repo="${BASH_REMATCH[1]}/${BASH_REMATCH[2]}"
            gh_tag="${BASH_REMATCH[3]}"
            gh_asset="${BASH_REMATCH[4]}"
          elif [[ "$src" =~ ^https://github\.com/([^/]+)/([^/]+)/releases/latest/download/([^/]+)$ ]]; then
            gh_repo="${BASH_REMATCH[1]}/${BASH_REMATCH[2]}"
            gh_asset="${BASH_REMATCH[3]}"
          fi
          if [ -n "$gh_repo" ]; then
            rm -rf /tmp/ytlredirect-dl
            mkdir -p /tmp/ytlredirect-dl
            if [ -n "$gh_tag" ]; then
              gh release download "$gh_tag" -R "$gh_repo" -p "$gh_asset" -D /tmp/ytlredirect-dl
            else
              gh release download -R "$gh_repo" -p "$gh_asset" -D /tmp/ytlredirect-dl
            fi
            src="/tmp/ytlredirect-dl/$gh_asset"
          else
            curl_args=(-fL --retry 3)
            if [ -n "${REDIRECT_DEB_TOKEN:-}" ]; then
              curl_args+=(-H "Authorization: Bearer $REDIRECT_DEB_TOKEN" -H "Accept: application/octet-stream")
            fi
            curl "${curl_args[@]}" "$src" -o /tmp/ytlredirect-download
            src="/tmp/ytlredirect-download"
          fi
          case "$(file --mime-type -b "$src")" in
            application/vnd.debian.binary-package|application/x-debian-package)
              mv "$src" ytlredirect.deb
              ;;
            application/zip)
              # zips contain the debs, e.g. under packages/ in an artifact zip
              rm -rf /tmp/ytlredirect-extract
              mkdir -p /tmp/ytlredirect-extract
              unzip -q "$src" -d /tmp/ytlredirect-extract
              deb=$(find /tmp/ytlredirect-extract -name '*_iphoneos-arm.deb' -print -quit)
              [ -n "$deb" ] || deb=$(find /tmp/ytlredirect-extract -name '*.deb' -print -quit)
              if [ -z "$deb" ]; then
                echo "::error::No .deb found inside the downloaded zip."
                exit 1
              fi
              cp "$deb" ytlredirect.deb
              ;;
            *)
              echo "::error::Downloaded file is neither a deb nor a zip."
              exit 1
              ;;
          esac
          file ytlredirect.deb

      - name: Download and validate IPA
        run: |
          wget "${{ github.event.inputs.ipa_url }}" --no-verbose -O youtube.ipa
          file_type=$(file --mime-type -b youtube.ipa)
          if [[ "$file_type" != "application/x-ios-app" && "$file_type" != "application/zip" ]]; then
            echo "::error::Validation failed: The downloaded file is not a valid IPA. Detected type: $file_type."
            exit 1
          fi

      - name: Patch Info.plist
        run: |
          unzip -q youtube.ipa -d ipa_tmp
          plist="$(find ipa_tmp/Payload -maxdepth 1 -name '*.app' | head -n 1)/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :UIDesignRequiresCompatibility" "$plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Delete :NSFaceIDUsageDescription" "$plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSFaceIDUsageDescription string 'Face ID is required to authenticate.'" "$plist"
          rm youtube.ipa
          (cd ipa_tmp && zip -qry ../youtube.ipa .)
          rm -rf ipa_tmp

      - name: Install cyan
        run: pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      - name: Inject tweaks into IPA
        run: |
          tweaks="ytplus.deb OpenYoutubeSafariExtension.appex"
          for f in *.deb; do
            [ -f "$f" ] && tweaks="$tweaks $f"
          done
          cyan -i youtube.ipa -o YouTubePlus_Beta.ipa -uwef $tweaks -n "${{ github.event.inputs.display_name }}" -b ${{ github.event.inputs.bundle_id }}

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ytp-beta-${{ github.run_number }}
          name: YouTubePlus Beta (${{ github.run_number }})
          files: YouTubePlus_Beta.ipa
          draft: true

      - name: Output Release URL
        run: |
          echo "::notice::Release available at: https://github.com/${{ github.repository }}/releases"
